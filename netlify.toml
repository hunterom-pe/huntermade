# Netlify configuration for Hunter Made
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- Headers ---------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Vite's hashed build assets never change — cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The form skeleton exists only so Netlify can detect the form
[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# No SPA catch-all redirect: this is a single static page plus /privacy/.
# Unknown paths fall through to dist/404.html automatically.
